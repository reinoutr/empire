# Inspiratie voor de digital garden van Rein

# Agenda


1. Onderwerp

5. introtekst van max. 180 tekens

# Onderwerp

Ik wil mijn digital garden laten gaan over het maken van sieraden, vooral met de focus op kettingen en armbanden, omdat ik dit een van mijn hobby's is. Het lijkt mij ook leuk om voor mijn digital garden ook andere soorten sieraden te laten zien, zodat ik zelf er ook van kan leren en dan kan mijn digital garden eventueel ontwikkelen, dus bijvoorbeeld met maken van sleutelhangers etc.
Ik wil dit doen aan de hand van voornamelijk foto's, Als een soort inspiratiebord, met onder andere foto's van mijn eigen werk. Een aantal toturials toevoegen kan ook handig zijn, vooral voor de dingen die wat moeilijker kunnen zijn​.
